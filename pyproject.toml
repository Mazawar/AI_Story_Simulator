[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-story-simulator"
version = "0.1.0"
description = "单机 AI 剧情模拟游戏：内置本地小模型 + 剧本包 + 交互面板 + 小说拆解"
readme = "README.md"
requires-python = ">=3.11"

# 骨架阶段零第三方依赖；各能力按需安装对应 extras（见 README）
dependencies = []

[project.optional-dependencies]
local = ["llama-cpp-python>=0.3"]          # 本地 GGUF 推理
ui = ["PySide6>=6.6", "PySide6-Addons>=6.6"]  # Widgets 外壳 + WebEngine 游戏视图
embed = ["fastembed>=0.3"]                 # 嵌入/检索（小说投喂用）
dev = ["pytest>=8"]

[project.scripts]
story-sim = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]
