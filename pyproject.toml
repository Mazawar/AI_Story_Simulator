[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-story-simulator"
version = "0.1.0"
description = "单机 AI 剧情模拟游戏：内置本地小模型 + 剧本包 + 交互面板 + 小说拆解"
readme = "README.md"
requires-python = ">=3.11"

# 骨架阶段零第三方依赖；各能力按需安装对应 extras（见 README）
dependencies = []

[project.optional-dependencies]
local = ["llama-cpp-python>=0.3"]          # 本地 GGUF 推理
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]  # 本地服务（前端接口）
desktop = ["pywebview>=5"]                 # 桌面窗口壳（WebView2）
embed = ["fastembed>=0.3"]                 # 嵌入/检索（小说投喂用）
dev = ["pytest>=8", "httpx>=0.27"]         # 测试（含 FastAPI TestClient）

[project.scripts]
story-sim = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]
