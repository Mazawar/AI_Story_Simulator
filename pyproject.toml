[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-story-simulator"
version = "0.3.0-preview.1"
description = "单机 AI 剧情模拟游戏：内置本地小模型 + 剧本包 + 交互面板 + 小说拆解"
readme = "README.md"
requires-python = ">=3.11"

# 运行时核心依赖（uv sync 自动安装）
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
local = ["llama-cpp-python>=0.3"]          # 本地 GGUF 推理
desktop = ["pywebview>=5"]                 # 桌面窗口壳（WebView2）
dev = [
    "pytest>=8",
    "httpx>=0.27",                         # FastAPI TestClient
    "pyinstaller>=6",                      # EXE 打包
]
embed = ["fastembed>=0.3"]                 # 嵌入/检索（小说投喂用，阶段3）

[project.scripts]
story-sim = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.uv]
# 打包/开发环境一律装齐（本地图形界面即核心形态）
default-groups = "all"

[dependency-groups]
dev = [
    "pillow>=12.3.0",
]
